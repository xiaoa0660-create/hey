<svg xmlns="http://www.w3.org/2000/svg" width="900" height="970" viewBox="0 0 900 970" role="img" aria-label="拍摄时的角色分工与信息优先级"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#f04457"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="16" fill="#f04457" font-weight="400">B · 笔记版 / DESIGN SPECIFICATION</text><text x="40" y="99" font-size="34" fill="#f04457" font-weight="600">拍摄时的角色分工与信息优先级</text><text x="40" y="137" font-size="18" fill="#252b26" font-weight="400">线框指导实时页面布局；相机照片与辅助图层分别保存</text><rect x="40" y="175" width="390" height="740" rx="24" fill="#1b2722"/><text x="65" y="218" font-size="18" fill="white" font-weight="400">返回拍法                     一起拍</text><rect x="90" y="245" width="290" height="300" rx="12" fill="#668078"/><rect x="190" y="292" width="130" height="213" stroke="#e4f2b4" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="126" y="408" font-size="22" fill="white" font-weight="400">实际相机画面</text><text x="65" y="586" font-size="17" fill="#dce7b7" font-weight="400">拿手机的人 · 你来调整</text><text x="65" y="626" font-size="23" fill="white" font-weight="600">人物在画面里再靠右一点</text><text x="65" y="685" font-size="18" fill="white" font-weight="400">镜头前的人 · 保持站位，先看同伴</text><text x="65" y="735" font-size="16" fill="#c2cbbc" font-weight="400">用光建议 →              辅助线显隐</text><circle cx="234" cy="810" r="34" fill="white" stroke="#dce7b7" stroke-width="4"/><text x="120" y="880" font-size="17" fill="#c2cbbc" font-weight="400">随时按快门，不必等完美</text><rect x="475" y="175" width="380" height="118" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="210" font-size="22" fill="#f04457" font-weight="600">C1 · 视觉目标</text><text x="495" y="242" font-size="18" fill="#252b26" font-weight="400">位置、大小与参考小窗</text><rect x="475" y="340" width="380" height="118" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="375" font-size="22" fill="#f04457" font-weight="600">C2 · 先构图，再动作</text><text x="495" y="407" font-size="18" fill="#252b26" font-weight="400">优先提示拿手机的人调整</text><rect x="475" y="505" width="380" height="118" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="540" font-size="22" fill="#f04457" font-weight="600">C3 · 双方知道各做什么</text><text x="495" y="572" font-size="18" fill="#252b26" font-weight="400">被拍者一句静态／动作提示</text><rect x="475" y="670" width="380" height="118" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="705" font-size="22" fill="#f04457" font-weight="600">C4 / C5 · 简单且可控</text><text x="495" y="737" font-size="18" fill="#252b26" font-weight="400">快门首屏可达，用光次级展开</text></g></svg>