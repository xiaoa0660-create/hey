<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950" role="img" aria-label="上传入口与个人参考管理"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#f04457"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="16" fill="#f04457" font-weight="400">B · 笔记版 / DESIGN SPECIFICATION</text><text x="40" y="99" font-size="34" fill="#f04457" font-weight="600">上传入口与个人参考管理</text><text x="40" y="137" font-size="18" fill="#252b26" font-weight="400">交互线框规定位置与行为，图中不是最终界面截图</text><rect x="40" y="165" width="390" height="730" rx="24" fill="#ffffff" stroke="#f04457" stroke-width="2"/><text x="66" y="212" font-size="28" fill="#f04457" font-weight="600">找参考</text><text x="65" y="249" font-size="18" fill="#252b26" font-weight="400">全部  日常人像  同款打卡  画作复刻</text><rect x="65" y="273" width="340" height="118" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><circle cx="91" cy="300" r="14" fill="#f04457"/><text x="84" y="306" font-size="16" fill="white" font-weight="600">1</text><text x="115" y="308" font-size="22" fill="#f04457" font-weight="600">上传想复刻的画作</text><text x="85" y="340" font-size="18" fill="#252b26" font-weight="400">相册选图，直接看拍法</text><text x="65" y="429" font-size="20" fill="#f04457" font-weight="400">全部参考    我的参考 · 1</text><text x="65" y="475" font-size="16" fill="#252b26" font-weight="400">全部场景                         1 个拍法</text><rect x="65" y="503" width="153" height="195" rx="12" fill="#fff0f2"/><rect x="236" y="503" width="169" height="195" rx="12" fill="#fff0f2"/><text x="80" y="594" font-size="20" fill="#f04457" font-weight="400">参考图</text><text x="258" y="594" font-size="20" fill="#f04457" font-weight="400">个人参考</text><text x="65" y="735" font-size="18" fill="#252b26" font-weight="400">名称                         管理  ♡</text><text x="65" y="857" font-size="18" fill="#f04457" font-weight="400">开始拍    找参考    收藏    我的拍摄</text><rect x="475" y="175" width="380" height="120" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="210" font-size="22" fill="#f04457" font-weight="600">U1 · 输入在分类旁</text><text x="495" y="242" font-size="18" fill="#252b26" font-weight="400">每类都可上传；按钮明确输入内容</text><text x="495" y="270" font-size="18" fill="#252b26" font-weight="400">不要求用户返回首页找上传</text><rect x="475" y="325" width="380" height="120" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="360" font-size="22" fill="#f04457" font-weight="600">U2 · 来源与分类可组合</text><text x="495" y="392" font-size="18" fill="#252b26" font-weight="400">个人参考属于对应类别</text><text x="495" y="420" font-size="18" fill="#252b26" font-weight="400">不新建第五个底部 TAB</text><rect x="475" y="475" width="380" height="120" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="510" font-size="22" fill="#f04457" font-weight="600">U3 · 选图后直接 P5</text><text x="495" y="542" font-size="18" fill="#252b26" font-weight="400">保存参考失败仍能继续拍</text><text x="495" y="570" font-size="18" fill="#252b26" font-weight="400">成功才提示已加入个人参考</text><rect x="475" y="625" width="380" height="150" rx="16" fill="#fff0f2" stroke="#f04457" stroke-width="1.5"/><text x="495" y="660" font-size="22" fill="#f04457" font-weight="600">U4 · 管理可找回</text><text x="495" y="692" font-size="18" fill="#252b26" font-weight="400">改名 / 改分类 / 删除确认</text><text x="495" y="720" font-size="18" fill="#252b26" font-weight="400">改分类后切到新类别</text><text x="495" y="748" font-size="18" fill="#252b26" font-weight="400">删除参考不删除已保存拍摄</text></g></svg>