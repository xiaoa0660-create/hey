<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-label="三种人景比例，三个可比较的选择"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#273f35"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="16" fill="#273f35" font-weight="400">A · 杂志版 / DESIGN SPECIFICATION</text><text x="40" y="99" font-size="34" fill="#273f35" font-weight="600">三种人景比例，三个可比较的选择</text><text x="40" y="137" font-size="18" fill="#252b26" font-weight="400">图中为设计示意；不是模型检测出的真实人物</text><text x="40" y="210" font-size="25" fill="#273f35" font-weight="600">多留风景</text><rect x="40" y="235" width="240" height="335" rx="14" fill="#d7e4e4"/><path d="M40 360L120 290L180 330L240 285L280 360" fill="#a8bbbb"/><path d="M40 380H280" stroke="#6c8d8d"/><rect x="40" y="480" width="240" height="90" fill="#ded8c9"/><rect x="190" y="455" width="38" height="91" fill="none" stroke="#273f35" stroke-width="2" stroke-dasharray="6 5"/><circle cx="209.0" cy="467.74" r="6.460000000000001" fill="#273f35"/><path d="M209.0 481.39V514.15M199.5 495.04H218.5M209.0 514.15L201.4 541.45M209.0 514.15L216.6 541.45" stroke="#273f35" stroke-width="3.04" fill="none"/><text x="330" y="210" font-size="25" fill="#273f35" font-weight="600">人景平衡</text><rect x="330" y="235" width="240" height="335" rx="14" fill="#d7e4e4"/><path d="M330 360L410 290L470 330L530 285L570 360" fill="#a8bbbb"/><path d="M330 380H570" stroke="#6c8d8d"/><rect x="330" y="480" width="240" height="90" fill="#ded8c9"/><rect x="475" y="407" width="56" height="140" fill="none" stroke="#273f35" stroke-width="2" stroke-dasharray="6 5"/><circle cx="503.0" cy="426.6" r="9.520000000000001" fill="#273f35"/><path d="M503.0 447.6V498.0M489.0 468.6H517.0M503.0 498.0L491.8 540.0M503.0 498.0L514.2 540.0" stroke="#273f35" stroke-width="4.48" fill="none"/><text x="620" y="210" font-size="25" fill="#273f35" font-weight="600">突出人物</text><rect x="620" y="235" width="240" height="335" rx="14" fill="#d7e4e4"/><path d="M620 360L700 290L760 330L820 285L860 360" fill="#a8bbbb"/><path d="M620 380H860" stroke="#6c8d8d"/><rect x="620" y="480" width="240" height="90" fill="#ded8c9"/><rect x="730" y="298" width="93" height="248" fill="none" stroke="#273f35" stroke-width="2" stroke-dasharray="6 5"/><circle cx="776.5" cy="332.72" r="15.81" fill="#273f35"/><path d="M776.5 369.92V459.20000000000005M753.25 407.12H799.75M776.5 459.20000000000005L757.9 533.6M776.5 459.20000000000005L795.1 533.6" stroke="#273f35" stroke-width="7.44" fill="none"/><rect x="40" y="620" width="820" height="130" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="60" y="655" font-size="22" fill="#273f35" font-weight="600">框是画面建议，不是地面导航</text><text x="60" y="687" font-size="18" fill="#252b26" font-weight="400">x/y/width/height 用 0–1 坐标表示；三种人物高度依次增加</text><text x="60" y="715" font-size="18" fill="#252b26" font-weight="400">拿手机的人调整取景；镜头前的人先确认真实平坦站位</text><text x="40" y="800" font-size="22" fill="#273f35" font-weight="400">不可由单图编造精确米数、可走路径或真实光源位置。</text></g></svg>