<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960" role="img" aria-label="从一张照片到第一张成片"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#273f35"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="16" fill="#273f35" font-weight="400">A · 杂志版 / DESIGN SPECIFICATION</text><text x="40" y="99" font-size="34" fill="#273f35" font-weight="600">从一张照片到第一张成片</text><text x="40" y="137" font-size="18" fill="#252b26" font-weight="400">页面少跳转，每次只强调一个下一步</text><rect x="40" y="175" width="250" height="110" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="60" y="210" font-size="22" fill="#273f35" font-weight="600">拍现场风景</text><text x="60" y="242" font-size="18" fill="#252b26" font-weight="400">先拍空景，人物稍后入画</text><path d="M165 285 L450 338" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="325" y="175" width="250" height="110" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="345" y="210" font-size="22" fill="#273f35" font-weight="600">导入自己的参考</text><text x="345" y="242" font-size="18" fill="#252b26" font-weight="400">分类上传，自动进入拍法</text><path d="M450 285 L450 338" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="610" y="175" width="250" height="110" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="630" y="210" font-size="22" fill="#273f35" font-weight="600">选内置参考</text><text x="630" y="242" font-size="18" fill="#252b26" font-weight="400">详情确认想借的构图与光</text><path d="M735 285 L450 338" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="215" y="350" width="470" height="134" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><circle cx="241" cy="377" r="14" fill="#273f35"/><text x="234" y="383" font-size="16" fill="white" font-weight="600">1</text><text x="265" y="385" font-size="22" fill="#273f35" font-weight="600">这张怎么拍</text><text x="235" y="417" font-size="18" fill="#252b26" font-weight="400">先看人物位置示意</text><text x="235" y="445" font-size="18" fill="#252b26" font-weight="400">拿手机的人一句，镜头前的人一句</text><path d="M450 484 L450 535" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="215" y="550" width="470" height="110" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><circle cx="241" cy="577" r="14" fill="#273f35"/><text x="234" y="583" font-size="16" fill="white" font-weight="600">2</text><text x="265" y="585" font-size="22" fill="#273f35" font-weight="600">首次交接 → 主动开相机</text><text x="235" y="617" font-size="18" fill="#252b26" font-weight="400">高</text><text x="235" y="645" font-size="18" fill="#252b26" font-weight="400">级</text><text x="235" y="673" font-size="18" fill="#252b26" font-weight="400">编</text><text x="235" y="701" font-size="18" fill="#252b26" font-weight="400">辑</text><text x="235" y="729" font-size="18" fill="#252b26" font-weight="400">可</text><text x="235" y="757" font-size="18" fill="#252b26" font-weight="400">选</text><text x="235" y="785" font-size="18" fill="#252b26" font-weight="400">；</text><text x="235" y="813" font-size="18" fill="#252b26" font-weight="400">不</text><text x="235" y="841" font-size="18" fill="#252b26" font-weight="400">挡</text><text x="235" y="869" font-size="18" fill="#252b26" font-weight="400">住</text><text x="235" y="897" font-size="18" fill="#252b26" font-weight="400">第</text><text x="235" y="925" font-size="18" fill="#252b26" font-weight="400">一</text><text x="235" y="953" font-size="18" fill="#252b26" font-weight="400">张</text><path d="M450 660 L450 711" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="215" y="725" width="470" height="115" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><circle cx="241" cy="752" r="14" fill="#273f35"/><text x="234" y="758" font-size="16" fill="white" font-weight="600">3</text><text x="265" y="760" font-size="22" fill="#273f35" font-weight="600">拍摄结果</text><text x="235" y="792" font-size="18" fill="#252b26" font-weight="400">导</text><text x="235" y="820" font-size="18" fill="#252b26" font-weight="400">出</text><text x="235" y="848" font-size="18" fill="#252b26" font-weight="400"> </text><text x="235" y="876" font-size="18" fill="#252b26" font-weight="400">/</text><text x="235" y="904" font-size="18" fill="#252b26" font-weight="400"> </text><text x="235" y="932" font-size="18" fill="#252b26" font-weight="400">明</text><text x="235" y="960" font-size="18" fill="#252b26" font-weight="400">确</text><text x="235" y="988" font-size="18" fill="#252b26" font-weight="400">保</text><text x="235" y="1016" font-size="18" fill="#252b26" font-weight="400">存</text><text x="235" y="1044" font-size="18" fill="#252b26" font-weight="400"> </text><text x="235" y="1072" font-size="18" fill="#252b26" font-weight="400">/</text><text x="235" y="1100" font-size="18" fill="#252b26" font-weight="400"> </text><text x="235" y="1128" font-size="18" fill="#252b26" font-weight="400">只</text><text x="235" y="1156" font-size="18" fill="#252b26" font-weight="400">改</text><text x="235" y="1184" font-size="18" fill="#252b26" font-weight="400">一</text><text x="235" y="1212" font-size="18" fill="#252b26" font-weight="400">点</text><text x="235" y="1240" font-size="18" fill="#252b26" font-weight="400">再</text><text x="235" y="1268" font-size="18" fill="#252b26" font-weight="400">拍</text><path d="M685 783H825V603H688" fill="none" stroke="#273f35" stroke-width="2" marker-end="url(#arrow)"/><text x="711" y="697" font-size="16" fill="#273f35" font-weight="400">直接重拍</text><text x="40" y="910" font-size="20" fill="#273f35" font-weight="400">收藏保存参考偏好；我的拍摄保存拍法与一张结果；两者不混用。</text></g></svg>