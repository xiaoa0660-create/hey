<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 900 1010" role="img" aria-label="模型调用时序与边界"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#273f35"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="16" fill="#273f35" font-weight="400">A · 杂志版 / DESIGN SPECIFICATION</text><text x="40" y="99" font-size="34" fill="#273f35" font-weight="600">模型调用时序与边界</text><text x="40" y="137" font-size="18" fill="#252b26" font-weight="400">授权、输入、验证、用户确认分别负责；一次调用解决一个问题</text><rect x="40" y="172" width="170" height="65" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="60" y="207" font-size="22" fill="#273f35" font-weight="600">用户</text><path d="M125 240V760" stroke="#b5b9b1" stroke-dasharray="6 6"/><rect x="255" y="172" width="170" height="65" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="275" y="207" font-size="22" fill="#273f35" font-weight="600">手机前端</text><path d="M340 240V760" stroke="#b5b9b1" stroke-dasharray="6 6"/><rect x="470" y="172" width="170" height="65" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="490" y="207" font-size="22" fill="#273f35" font-weight="600">Node 后端</text><path d="M555 240V760" stroke="#b5b9b1" stroke-dasharray="6 6"/><rect x="690" y="172" width="170" height="65" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="710" y="207" font-size="22" fill="#273f35" font-weight="600">视觉模型</text><path d="M775 240V760" stroke="#b5b9b1" stroke-dasharray="6 6"/><path d="M125 290 L340 290" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="137" y="278" font-size="17" fill="#273f35" font-weight="400">选图，点 AI</text><path d="M340 355 L555 355" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="352" y="343" font-size="17" fill="#273f35" font-weight="400">M1 health，不传图</text><path d="M125 420 L340 420" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="137" y="408" font-size="17" fill="#273f35" font-weight="400">M2 明确同意</text><path d="M340 475 L555 475" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="352" y="463" font-size="17" fill="#273f35" font-weight="400">POST scene / interpret</text><path d="M555 530 L775 530" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="567" y="518" font-size="17" fill="#273f35" font-weight="400">图片＋约束，20秒上限</text><path d="M775 585 L555 585" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="567" y="573" font-size="17" fill="#273f35" font-weight="400">结构化 JSON</text><path d="M555 640 L340 640" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="352" y="628" font-size="17" fill="#273f35" font-weight="400">M3 schema＋语义校验</text><path d="M125 710 L340 710" stroke="#273f35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="137" y="698" font-size="17" fill="#273f35" font-weight="400">M4 选择并应用方案</text><rect x="40" y="795" width="820" height="118" rx="16" fill="#e9edde" stroke="#273f35" stroke-width="1.5"/><text x="60" y="830" font-size="22" fill="#273f35" font-weight="600">M5 · 开相机后，实时模型在手机本地</text><text x="60" y="862" font-size="18" fill="#252b26" font-weight="400">相机帧 → 人物与关键点 → 几何规则 → 一句提示；不持续调用大模型</text><text x="40" y="957" font-size="19" fill="#273f35" font-weight="400">失败或未配置：保留原图 → 手动拍法；取消：旧结果不能覆盖新输入。</text></g></svg>