<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F3ED" />
    <meta
      name="description"
      content="你选喜欢的画面，同伴照着目标拍。照着拍，陪被拍者和拍摄者一起完成一张满意的照片。"
    />
    <title>照着拍 · 你想要的，一起拍出来</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <aside
      id="local-file-help"
      hidden
      style="
        max-width: 560px;
        margin: 12vh auto;
        padding: 30px;
        background: #f5f3ed;
        color: #273f35;
        font:
          16px/1.9 system-ui,
          sans-serif;
        border-radius: 12px;
      "
    >
      <h1 style="font-size: 26px">照着拍，需要从体验网址打开。</h1>
      <p>
        你现在打开的是电脑里的文件。请先把整个网页文件夹上传，图片、相机和人体识别才能一起工作。
      </p>
      <ol>
        <li>找到直接包含 index.html、images、models 的文件夹。</li>
        <li>在 Netlify 的上传区域或现有项目的 Deploys 页，上传这个文件夹。</li>
        <li>发布完成后，打开它生成的 https://…netlify.app 网址。</li>
      </ol>
      <a
        href="https://app.netlify.com/drop"
        style="color: #273f35; font-weight: 600"
        >打开上传页面 →</a
      >
    </aside>
    <script>
      if (location.protocol === "file:") {
        document.getElementById("root").hidden = true;
        document.getElementById("local-file-help").hidden = false;
        document.body.style.background = "#e9e9df";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
